name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Pull latest image and restart
        run: |
          cd ~/statusboard-deploy
          sudo docker compose pull
          sudo docker compose up -d