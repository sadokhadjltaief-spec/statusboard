services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statusboard
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: statusboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statusboard -d statusboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://statusboard:mysecretpassword@db:5432/statusboard
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: